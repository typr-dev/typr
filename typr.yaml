types:
  Customer:
    alignedSources:
      duckdb:customers:
        entity: customers
        mode: superset
      mariadb:customers:
        entity: customers
        mode: superset
    fields:
      created_at:
        array: false
        nullable: true
        type: String
      customer_id:
        array: false
        nullable: false
        type: String
      email:
        array: false
        nullable: true
        type: String
    kind: domain
    primary: sqlserver:customers
processes:
  order_fulfillment:
    version: 1

    sources:
      events: avro-events
      api: api
      db: postgres

    states:
      Draft:
        fields:
          items: List[String]
          customer_id: String
      Submitted:
        includes: [Draft]
        fields:
          submitted_at: Instant
      PaymentPending:
        includes: [Submitted]
        fields:
          payment_intent_id: String
      Paid:
        includes: [Submitted, "events:PaymentCharged"]
      Shipped:
        includes: [Paid, "events:OrderShipped"]
      ReviewPending:
        includes: [Shipped]
      WebhookNotified:
        includes: [Shipped]
      Completed:
        includes: [Shipped, "events:OrderDelivered"]
      Cancelled:
        fields:
          reason: String
          cancelled_at: Instant

    events:
      OrderSubmitted:
        fields:
          submitted_at: Instant
      PaymentRequested:
        fields:
          payment_intent_id: String
      PaymentCharged:
        ref: events:PaymentCharged
        fields:
          payment_id: String
          transaction_id: String
          amount: Long
          paid_at: Instant
      OrderShipped:
        fields:
          tracking: String
          shipped_at: Instant
      ReviewTimerFired:
        fields: {}
      WebhookSent:
        fields: {}
      OrderDelivered:
        fields:
          delivered_at: Instant
      OrderCancelled:
        fields:
          reason: String
          cancelled_at: Instant
      InventoryReleased:
        fields: {}
      PaymentRefunded:
        fields:
          refund_id: String

    signals:
      SubmitOrderRequest:
        fields: {}
      PaymentCallback:
        ref: events:PaymentCallback
        correlation_key: order_id
        fields:
          order_id: String
          payment_id: String
          transaction_id: String
          amount: Long
          paid_at: Instant
      DeliveryConfirmation:
        correlation_key: tracking_number
        fields:
          tracking_number: String
          delivered_at: Instant
      CancelOrderRequest:
        fields:
          reason: String

    errors:
      PaymentDeclined:
        fields:
          reason: String
      InsufficientFunds:
        fields:
          available: Long
          required: Long

    steps:
      submit:
        type: signal
        signal: SubmitOrderRequest
        from: Draft
        to: Submitted
        event: OrderSubmitted
        produce:
          topic: order-events

      request_payment:
        type: io
        from: Submitted
        to: PaymentPending
        event: PaymentRequested
        call:
          operation: createPaymentIntent

      await_payment:
        type: signal
        signal: PaymentCallback
        from: PaymentPending
        to: Paid
        event: PaymentCharged
        errors: [PaymentDeclined, InsufficientFunds]
        on_error: cancel
        timeout: P3D
        on_timeout: cancel
        compensation: refund_payment
        consume:
          topic: payment-callbacks

      ship:
        type: io
        from: Paid
        to: Shipped
        event: OrderShipped
        retry:
          max_attempts: 3
          backoff: exponential
        compensation: release_inventory
        persist:
          table: orders
          source: db

      wait_for_review:
        type: timer
        duration: PT24H
        from: Shipped
        to: ReviewPending
        event: ReviewTimerFired

      notify_webhook:
        type: http
        url: "https://hooks.example.com/order-shipped"
        method: POST
        from: ReviewPending
        to: WebhookNotified
        event: WebhookSent
        timeout: PT30S

      deliver:
        type: signal
        signal: DeliveryConfirmation
        from: WebhookNotified
        to: Completed
        event: OrderDelivered

      cancel:
        type: signal
        signal: CancelOrderRequest
        from: [Draft, Submitted, PaymentPending]
        to: Cancelled
        event: OrderCancelled
        interrupts: true

    compensation_steps:
      refund_payment:
        input_state: Paid
        input_event: PaymentCharged
        event: PaymentRefunded
      release_inventory:
        input_state: Shipped
        input_event: OrderShipped
        event: InventoryReleased

    flow:
      - submit
      - request_payment
      - await_payment
      - ship
      - wait_for_review
      - notify_webhook
      - deliver

version: 1
