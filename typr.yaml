boundaries:
  grpc-services:
    proto_path: testers/grpc/protos
    type: grpc
  oracle:
    service: FREEPDB1
    host: localhost
    sql_scripts: sql-scripts/oracle
    username: typr
    types:
      Email:
        db:
          column: email
    selectors:
      exclude_tables:
      - test_genkeys_1767399918202
      - test_genkeys_1767491891912
      - test_json_rt_1767496451381
      - test_table_1767489875539
      precision_types:
      - PRECISION_TYPES
      - PRECISION_TYPES_NULL
    schema_mode: single_schema:TYPR
    port: 1521
    type: oracle
    password: typr_password
  avro-events:
    default_header_schema: standard
    header_schemas:
      standard:
        fields:
        - name: correlationId
          required: true
          type: uuid
        - name: timestamp
          required: true
          type: instant
        - name: source
          required: false
          type: string
    schemas:
    - testers/avro/schemas
    enable_precise_types: true
    type: avro
    topic_headers:
      order-events: standard
    generate_kafka_rpc: true
  postgres:
    schemas:
    - humanresources
    - person
    - production
    - public
    - sales
    password: password
    type: postgresql
    username: postgres
    port: 6432
    types:
      LastName:
        db:
          column: lastname
      Description:
        db:
          column: description
      CurrentFlag:
        db:
          column: currentflag
      MiddleName:
        db:
          column: middlename
      FirstName:
        db:
          column: firstname
      OnlineOrderFlag:
        db:
          column: onlineorderflag
      SalariedFlag:
        db:
          column: salariedflag
      ActiveFlag:
        db:
          column: activeflag
    type_override:
      sales.creditcard.creditcardid: adventureworks.userdefined.CustomCreditcardId
    selectors:
      open_enums:
      - title
      - title_domain
      - issue142
      precision_types:
      - precision_types
      - precision_types_null
      tables:
      - department
      - employee
      - employeedepartmenthistory
      - shift
      - vemployee
      - address
      - addresstype
      - businessentity
      - businessentityaddress
      - countryregion
      - emailaddress
      - password
      - person
      - stateprovince
      - product
      - productcategory
      - productcosthistory
      - productmodel
      - productsubcategory
      - unitmeasure
      - flaff
      - identity-test
      - issue142
      - issue142_2
      - only_pk_columns
      - pgtest
      - pgtestnull
      - title
      - title_domain
      - titledperson
      - users
      - salesperson
      - salesterritory
      - precision_types
      - precision_types_null
    database: Adventureworks
    sql_scripts: sql-scripts/postgres
    host: localhost
  sqlserver:
    database: typr
    port: 1433
    schema_mode: single_schema:dbo
    host: localhost
    selectors:
      precision_types:
      - precision_types
      - precision_types_null
    username: sa
    password: YourStrong@Passw0rd
    types:
      Email:
        db:
          column:
          - email
          - '*_email'
    type: sqlserver
    sql_scripts: sql-scripts/sqlserver
  mariadb:
    selectors:
      precision_types:
      - precision_types
      - precision_types_null
    sql_scripts: sql-scripts/mariadb
    host: localhost
    schema_mode: single_schema:typr
    port: 3307
    types:
      IsDefault:
        db:
          column: is_default
      IsVerifiedPurchase:
        db:
          column: is_verified_purchase
      Email:
        db:
          column:
          - email
          - contact_email
      LastName:
        db:
          column: last_name
      IsPrimary:
        db:
          column: is_primary
      IsActive:
        db:
          column: is_active
      FirstName:
        db:
          column: first_name
      IsApproved:
        db:
          column: is_approved
    username: typr
    type: mariadb
    database: typr
    password: password
  api:
    generate_models: true
    generate_server: true
    spec: testers/combined/specs/combined-api.yaml
    type: openapi
  duckdb:
    schema_sql: sql-init/duckdb/00-schema.sql
    selectors:
      precision_types:
      - precision_types
      - precision_types_null
    sql_scripts: sql-scripts/duckdb
    path: ':memory:'
    types:
      Email:
        db:
          column: email
    type: duckdb
  db2:
    username: db2inst1
    password: password
    schema_mode: single_schema:DB2INST1
    host: localhost
    sql_scripts: sql-scripts/db2
    type: db2
    database: typr
    port: 50000
