$schema: https://raw.githubusercontent.com/oyvindberg/bleep/master/schema.json
$version: 1.0.0-M10
resolvers:
- https://packages.confluent.io/maven/
jvm:
  name: graalvm-community:25.0.0
projects:
  typr-dsl:
    dependencies: dev.typr.foundations:foundations-jdbc:1.0.0-RC6
    extends: template-publishable
    java:
      options: --release 24 -proc:none
    platform:
      name: jvm
    sourcegen:
    - main: scripts.GeneratedRowParsers
      project: typr-scripts-sourcegen
    - main: scripts.GeneratedTuples
      project: typr-scripts-sourcegen
  typr-dsl-kotlin:
    dependencies:
    - dev.typr.foundations:foundations-jdbc-kotlin:1.0.0-RC6
    - configuration: provided
      module: org.postgresql:postgresql:42.7.3
    dependsOn: typr-dsl
    extends:
    - template-kotlin
    - template-publishable
    kotlin:
      options: -Xnested-type-aliases
    sourcegen:
    - project: typr-scripts-sourcegen
      main: scripts.GeneratedRowParsers
    - project: typr-scripts-sourcegen
      main: scripts.GeneratedTuples
  typr-dsl-scala:
    dependencies:
    - dev.typr.foundations:foundations-jdbc-scala_3:1.0.0-RC6
    - configuration: provided
      module: org.postgresql:postgresql:42.7.3
    dependsOn: typr-dsl
    extends:
    - template-scala-3
    - template-publishable
    sourcegen:
    - project: typr-scripts-sourcegen
      main: scripts.GeneratedRowParsers
    - project: typr-scripts-sourcegen
